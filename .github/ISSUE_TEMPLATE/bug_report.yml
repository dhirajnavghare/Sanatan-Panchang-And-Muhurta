name: 🐛 Bug Report
description: File a bug report to help us fix issues in calculations, UI, or performance.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Sanatan! Please provide detailed information below.
  - type: input
    id: version
    attributes:
      label: Sanatan Version / Commit
      placeholder: e.g. v1.0.0 or commit hash
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device & OS
      placeholder: e.g. Samsung Galaxy S23 (Android 14) / iPhone 15 (iOS 17)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open Tab '...'
        2. Select Date '...'
        3. Observe issue '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened according to Panchang shastras or UI design.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Logs
      description: Drag and drop relevant screenshots or terminal logs.
