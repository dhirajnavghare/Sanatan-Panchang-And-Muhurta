name: CI

on:
  push:
    branches: [main, Phase2-issue-fix-3]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Typecheck & Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify TypeScript Typecheck
        run: npm run typecheck

      - name: Run Jest Test Suites
        run: npm test
